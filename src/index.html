<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>EduManager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E4D3C" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      TIPOGRAFIA DO EDUMANAGER - identidade "CAMPUS VIVO"
      ===================================================
      Tres familias, cada uma com um papel definido (ver src/styles.scss):

        Bricolage Grotesque -> fonte de TITULO e de NUMERO GRANDE. E uma
                               grotesca de desenho irregular de proposito: as
                               letras tem larguras diferentes entre si, o que
                               da personalidade ao titulo sem precisar de cor.
                               Eixos variaveis: opsz (tamanho optico),
                               wdth (largura) e wght (peso).
        Instrument Sans     -> fonte de TEXTO e de INTERFACE (botao, campo,
                               tabela, menu). Levemente estreita, entao cabe
                               mais informacao na linha da tabela sem apertar.
        DM Mono             -> NUMERO, codigo, data e valor. Monoespacada de
                               traco geometrico; alinha a coluna de valores na
                               virgula, como numa planilha de secretaria.

      ICONES
      ------
      "Material Symbols Rounded": a versao de cantos arredondados. Combina com
      os cantos generosos do sistema (14px a 28px) - a versao Outlined, de
      cantos retos, brigaria com eles. "Material Icons" fica como reserva: se a
      primeira fonte nao carregar, os mesmos NOMES de icone continuam valendo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..600&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
