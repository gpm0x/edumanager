<!-- VIEW do cabecalho de pagina: titulo a esquerda, acao principal a direita. -->
<header class="page-header">
  <div class="page-header__text">
    <h1 class="page-header__title">{{ title }}</h1>

    @if (subtitle) {
      <p class="page-header__subtitle">{{ subtitle }}</p>
    }
  </div>

  <!-- O botao existe somente quando a tela informa um actionLabel. -->
  @if (actionLabel) {
    <button mat-flat-button type="button" [disabled]="actionDisabled" (click)="action.emit()">
      <mat-icon>{{ actionIcon }}</mat-icon>
      {{ actionLabel }}
    </button>
  }
</header>
